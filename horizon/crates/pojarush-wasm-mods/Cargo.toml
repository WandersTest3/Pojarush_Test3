[package]
name = "pojarush-wasm-mods"
version = "0.1.0"
edition.workspace = true
license = "LGPL-3.0-or-later"
publish = false
description = "Pojarush's host for Horizon's wasm .hmod mods (api 0.2 with [wasm]): loads them with the vendored horizon-mod-wasm and lends the game's HUD, keys and settings to their hooks"

[dependencies]
mod_api = { package = "horizon-mod-api", path = "../../vendor/horizon-wasm-mods/crates/horizon-mod-api" }
horizon-mod-wasm = { path = "../../vendor/horizon-wasm-mods/crates/horizon-mod-wasm" }
horizon-mod-package = { path = "../../vendor/horizon-wasm-mods/crates/horizon-mod-package", default-features = false }
horizon-guest-stack = { path = "../../vendor/horizon-wasm-mods/crates/horizon-guest-stack" }
log = "0.4"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
serde_json = "1"
