[package]
build = "build.rs"
name = "horizon-mod-vocab"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Engine-owned mod interface vocabulary, host contracts and dispatch tables"

[lib]
name = "mod_vocab"

[dependencies]
horizon-mod-runtime = { path = "../horizon-mod-runtime" }
horizon-core = { package = "horizon-up-core", path = "../horizon-core" }
horizon-mod-api-macros = { path = "../horizon-mod-api-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
log = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"


[features]
testing = []
wasm-guest = []
mixed-output-fixture = []

[build-dependencies]
flate2 = "1"
