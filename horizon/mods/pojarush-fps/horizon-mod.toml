id = "pojarush_fps"
name = "PR FPS"
version = "1.1.10"
description = "Frames per second anywhere on the screen, at any size, with the slowest frame and the 1% low if you like. Drag it with the finger or the mouse at any time, in game or in any menu. Turns Horizon's own overlay off."

authors = ["Wanders_Test3"]
api = "0.1"
side = "client"
capabilities = ["render", "ui", "storage"]
experimental = ["render", "ui"]
minecraft = "26.3"
license = "Mod Test3 License V1.0"
icon = "assets/pojarush_fps/icon.png"

[contact]
homepage = "https://github.com/WandersTest3/Pojarush_Test3"
sources = "https://github.com/WandersTest3/Pojarush_Test3/tree/main/horizon/mods/pojarush-fps"
issues = "https://github.com/WandersTest3/Pojarush_Test3/issues"

[translations.pt_br]
description = "Quadros por segundo em qualquer lugar da tela, em qualquer tamanho, com o quadro mais lento e o 1% mais baixo se quiser. Arraste com o dedo ou com o mouse a qualquer momento, no jogo ou em qualquer menu. Desliga a sobreposição do próprio Horizon."

[translations.pt_pt]
description = "Fotogramas por segundo em qualquer sítio do ecrã, em qualquer tamanho, com o fotograma mais lento e o 1% mais baixo se quiseres. Arraste com o dedo ou com o mouse a qualquer momento, no jogo ou em qualquer menu. Desliga a sobreposição do próprio Horizon."
