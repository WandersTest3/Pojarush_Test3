[package]
name = "pojarush_modmenu"
version = "1.1.0"
edition = "2024"
license-file = "LICENSE.txt"
description = "Pojarush Mod Menu: the installed mods, their details and settings, in game."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../../crates/horizon-mod-sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
