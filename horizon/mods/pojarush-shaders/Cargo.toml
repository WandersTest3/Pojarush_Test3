[package]
name = "pojarush_shaders"
version = "1.1.0"
edition = "2024"
license-file = "LICENSE.txt"
description = "Pojarush Shaders: shader packs picked, reloaded and set up in game, as Iris does."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../../crates/horizon-mod-sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
