[package]
name = "pojarush_geckodemo"
version = "1.0.2"
edition = "2024"
license-file = "LICENSE.txt"
description = "Pojarush Model Demo: a GeckoLib-style model with an animation, placed with a key."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../../crates/horizon-mod-sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
